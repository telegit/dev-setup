site_name: Dev Reference
site_description: Personal developer cheat sheets, deployment guides, and project templates
site_url: https://telegit.github.io/dev-setup

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.sections
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      linenums_style: pymdownx-inline
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - toc:
      permalink: true
  - tables

nav:
  - Home: index.md
  - Cheat Sheets:
    - Python: python-cheatsheet.md
    - Astro / Jinja: astro-jinja-cheatsheet.md
  - Deployment Guides:
    - Netlify: netlify-deployment.md
    - noine.fm: noine-fm-deployment.md
  - Project Templates:
    - Small Biz Astro: small-biz-astro-template.md
  - Local Environment Setup:
    - Python Project Generator: python-project-generator.md
    - Dotfiles Setup: dotfiles-setup.md
    - Night Owl Theme: night-owl-theme.md
